name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install pandas requests python-dotenv SQLAlchemy pytest ruff
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transformation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dbt
        run: |
          sudo apt-get update && sudo apt-get install -y unixodbc
          pip install dbt-core==1.9.8 dbt-sqlserver==1.9.2
      - name: Parse project (no database connection needed)
        env:
          DBT_PROFILES_DIR: ci
        run: |
          dbt deps
          dbt parse
