fpl_pipeline:
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: host.docker.internal
      port: 1433
      database: FPL
      schema: raw
      user: "{{ env_var('FPL_DB_USER') }}"
      password: "{{ env_var('FPL_DB_PASSWORD') }}"  
      encrypt: true
      trust_cert: true
      threads: 1

  target: dev