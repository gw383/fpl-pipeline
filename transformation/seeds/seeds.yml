version: 2

seeds:
  - name: seasons
    description: >
      One row per Premier League season this project has data for. This used
      to be a plain analytics.seasons table that someone (or some ad-hoc
      script) created directly in SQL Server, with no CREATE TABLE or INSERT
      statement anywhere in the codebase -- so its contents couldn't be
      reviewed, diffed, or restored from git. It's now a dbt seed: a CSV
      checked into version control that `dbt seed` loads into the warehouse,
      giving this table the same history/reversibility as everything else in
      transformation/.

      IMPORTANT: the rows below are a best guess at real Premier League
      season boundaries, since the actual live values were not available to
      copy from anywhere in the repository. Before running `dbt seed`,
      compare this file against whatever is currently in your live
      analytics.seasons table (e.g. `select * from analytics.seasons`) and
      correct any id/date that doesn't match -- every other analytics model
      filters "current season" using `between s.start_date and s.end_date`,
      so a wrong date here would silently make every dashboard page look
      empty or use the wrong season's data.

      display_name also has to match, character for character, the
      CURRENT_SEASON value the raw tables were loaded with
      (extraction/config.py -- currently "2026-27"), since every staging
      model joins raw.<table>.season to seasons.display_name. This seed
      uses that same "YYYY-YY" hyphenated form; if your live table used a
      different form (e.g. "2026/27") you'll need to match whichever one
      your raw data actually uses, not necessarily the one below.
    config:
      column_types:
        id: int
        display_name: varchar(10)
        start_date: date
        end_date: date
    columns:
      - name: id
        tests:
          - not_null
          - unique
      - name: display_name
        tests:
          - not_null
          - unique
