# Example dbt profile for running dbt locally against SQL Server.
# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR) and adjust.
# The Airflow containers use airflow/dbt/profiles.yml instead.
fpl_pipeline:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      server: localhost
      port: 1433
      database: FPL
      schema: raw
      # Windows authentication; for a SQL login use `user`/`password` instead:
      windows_login: true
      # user: "{{ env_var('FPL_DB_USER') }}"
      # password: "{{ env_var('FPL_DB_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 4
