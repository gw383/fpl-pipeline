packages:
  # stg_tests.yml already used dbt_utils.unique_combination_of_columns
  # before this round of changes, but no packages.yml existed anywhere in
  # the project to actually install it -- so that test (and the new one
  # added for player_points below) could never have run. Run `dbt deps`
  # once after adopting this file to fetch the package.
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
