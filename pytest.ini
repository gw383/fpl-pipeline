[pytest]
# extraction/ and StreamLit/ have no __init__.py -- they're run as
# top-level script directories (python ingest.py; streamlit run Home.py),
# not installed packages. Adding both to pythonpath lets tests import
# e.g. `from common import ...` / `from player_utils import ...` exactly
# the way the application code itself does, without changing either
# folder's layout.
pythonpath = extraction StreamLit
testpaths = tests
